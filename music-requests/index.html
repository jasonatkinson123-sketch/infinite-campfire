<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://jasonatkinson123-sketch.github.io/derby-band-music-requests/">
  <title>Derby Band Music Requests — Opening Latest Version</title>
  <script>
    // This Infinite Campfire URL is used in student bookmarks/QR codes.
    // Keep the bookmark working, but maintain the repertoire in ONE app.
    (() => {
      const current = new URL(window.location.href);
      const canonical = new URL('https://jasonatkinson123-sketch.github.io/derby-band-music-requests/');
      canonical.search = current.search;
      canonical.hash = current.hash;
      window.location.replace(canonical.href);
    })();
  </script>
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#10162f;color:white;font:18px system-ui,sans-serif;text-align:center">
  <main style="padding:1.5rem">
    <h1>Derby Band Music Requests</h1>
    <p>Opening the latest music request station…</p>
    <p><a style="color:#bfe4ff" href="https://jasonatkinson123-sketch.github.io/derby-band-music-requests/">Tap here if it doesn’t open automatically.</a></p>
  </main>
</body>
</html>
