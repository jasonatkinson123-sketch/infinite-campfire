<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3eadb">
  <meta name="description" content="Infinite Campfire — five playful learning destinations.">
  <title>Infinite Campfire</title>
  <style>
    :root {
      --paper: #f3eadb;
      --ink: #090908;
      --red: #d52d21;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      min-width: 320px;
      overflow-x: hidden;
      background: var(--paper);
    }

    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      background: var(--paper);
    }

    .skip-link {
      position: fixed;
      z-index: 100;
      top: .75rem;
      left: .75rem;
      padding: .7rem .9rem;
      color: var(--paper);
      background: var(--ink);
      text-decoration: none;
      transform: translateY(-200%);
    }

    .skip-link:focus { transform: translateY(0); }

    main {
      min-height: 100svh;
      display: grid;
      place-items: center;
    }

    .poster-stage {
      container-type: inline-size;
      position: relative;
      width: min(100vw, calc(100svh * 16 / 9));
      aspect-ratio: 16 / 9;
      isolation: isolate;
      overflow: hidden;
      background: var(--paper);
    }

    .desktop-art {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    h1 {
      position: absolute;
      z-index: 2;
      top: 5.25%;
      left: 0;
      width: 100%;
      margin: 0;
      color: #000;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 5.55cqw;
      font-weight: 300;
      line-height: 1;
      letter-spacing: .105em;
      text-align: center;
      text-indent: .105em;
      white-space: nowrap;
    }

    .bird-layer {
      position: absolute;
      z-index: 5;
      top: 15.25%;
      left: 43.05%;
      width: 7.3%;
      pointer-events: none;
    }

    #bird-model-slot { pointer-events: none; }

    .bird-static {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      user-select: none;
    }

    .destination-list {
      position: absolute;
      inset: 0;
      z-index: 4;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .destination-item { position: absolute; }
    .destination-item:nth-child(1) { left: 21.42%; top: 27.66%; width: 27.99%; height: 13.66%; }
    .destination-item:nth-child(2) { left: 50.59%; top: 27.66%; width: 28.06%; height: 13.66%; }
    .destination-item:nth-child(3) { left: 21.42%; top: 43.40%; width: 27.99%; height: 13.66%; }
    .destination-item:nth-child(4) { left: 50.59%; top: 43.40%; width: 28.06%; height: 13.66%; }
    .destination-item:nth-child(5) { left: 50.59%; top: 58.80%; width: 27.60%; height: 13.77%; }

    .destination-link {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      color: #000;
      text-decoration: none;
      outline: none;
    }

    .mobile-sign-art { display: none; }

    .destination-label {
      position: absolute;
      top: 50%;
      color: #000;
      font-size: 2.05cqw;
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -.015em;
      transform: translateY(-50%);
      white-space: nowrap;
    }

    .destination-item:nth-child(1) .destination-label { left: 38.7%; }
    .destination-item:nth-child(2) .destination-label { left: 43.0%; }
    .destination-item:nth-child(3) .destination-label { left: 38.7%; }
    .destination-item:nth-child(4) .destination-label { left: 41.7%; }
    .destination-item:nth-child(5) .destination-label { left: 53.4%; }

    .destination-link::after {
      content: "";
      position: absolute;
      left: var(--underline-left, 39%);
      right: 5%;
      bottom: 19%;
      height: 2px;
      background: var(--red);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 150ms ease;
    }

    .destination-item:nth-child(2) .destination-link { --underline-left: 43%; }
    .destination-item:nth-child(4) .destination-link { --underline-left: 42%; }
    .destination-item:nth-child(5) .destination-link { --underline-left: 53%; }

    .destination-link:hover::after,
    .destination-link:focus-visible::after { transform: scaleX(1); }

    .destination-link:focus-visible {
      outline: 3px solid var(--red);
      outline-offset: 4px;
    }

    .mobile-scenery { display: none; }

    @media (max-width: 700px) {
      main { display: block; }

      .poster-stage {
        width: 100%;
        min-height: 1030px;
        aspect-ratio: auto;
        overflow: hidden;
        background: var(--paper);
      }

      .poster-stage::before {
        content: "";
        position: absolute;
        z-index: 0;
        inset: 0;
        opacity: .31;
        background-image: url("./assets/mobile-ground-scene.png");
        background-repeat: repeat-y;
        background-position: center bottom;
        background-size: auto 280px;
      }

      .desktop-art { display: none; }

      h1 {
        top: max(28px, env(safe-area-inset-top));
        padding: 0 10px;
        font-size: clamp(27px, 7.65vw, 35px);
        line-height: 1;
        letter-spacing: .075em;
        text-indent: .075em;
      }

      .bird-layer {
        top: 78px;
        left: 50%;
        width: 72px;
        transform: translateX(-50%);
      }

      .mobile-scenery { display: block; }

      .mobile-tree {
        position: absolute;
        z-index: 1;
        top: 112px;
        width: 44%;
        height: auto;
        opacity: .72;
        pointer-events: none;
      }

      .mobile-tree-left { left: -24%; }
      .mobile-tree-right { right: -24%; }

      .mobile-post {
        position: absolute;
        z-index: 2;
        top: 126px;
        bottom: 265px;
        left: 50%;
        width: 39px;
        transform: translateX(-50%);
        background: url("./assets/mobile-post-upper.png") center top / 100% auto repeat-y;
        pointer-events: none;
      }

      .destination-list {
        position: relative;
        z-index: 4;
        inset: auto;
        display: flex;
        flex-direction: column;
        gap: 9px;
        width: 100%;
        margin: 0;
        padding: 145px 10px 0;
      }

      .destination-item,
      .destination-item:nth-child(n) {
        position: relative;
        inset: auto;
        width: 100%;
        height: auto;
      }

      .destination-link {
        aspect-ratio: var(--sign-ratio);
        min-height: 88px;
      }

      .destination-item:nth-child(1) .destination-link { --sign-ratio: 436 / 122; }
      .destination-item:nth-child(2) .destination-link { --sign-ratio: 440 / 122; }
      .destination-item:nth-child(3) .destination-link { --sign-ratio: 436 / 122; }
      .destination-item:nth-child(4) .destination-link { --sign-ratio: 440 / 122; }
      .destination-item:nth-child(5) .destination-link { --sign-ratio: 424 / 118; }

      .mobile-sign-art {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
        user-select: none;
      }

      .destination-label,
      .destination-item:nth-child(n) .destination-label {
        top: 50%;
        left: var(--label-left);
        width: calc(94% - var(--label-left));
        font-size: clamp(20px, 5.8vw, 25px);
        line-height: 1.02;
        letter-spacing: -.025em;
        white-space: nowrap;
      }

      .destination-item:nth-child(1) { --label-left: 39%; }
      .destination-item:nth-child(2) { --label-left: 42%; }
      .destination-item:nth-child(3) { --label-left: 39%; }
      .destination-item:nth-child(4) { --label-left: 41%; }
      .destination-item:nth-child(5) { --label-left: 52%; }

      .destination-link::after {
        left: var(--label-left);
        right: 6%;
        bottom: 17%;
      }

      .destination-link:focus-visible {
        outline-width: 3px;
        outline-offset: 2px;
      }

      .mobile-fire {
        position: absolute;
        z-index: 3;
        left: 50%;
        bottom: 5px;
        width: min(128%, 480px);
        height: auto;
        transform: translateX(-50%);
        pointer-events: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#destinations">Skip to destinations</a>
  <main>
    <section class="poster-stage" aria-labelledby="page-title">
      <img class="desktop-art" src="./assets/campfire-desktop-master.png" alt="" aria-hidden="true">
      <h1 id="page-title">INFINITE CAMPFIRE</h1>

      <div class="bird-layer" aria-hidden="true">
        <div id="bird-model-slot">
          <img class="bird-static" src="./assets/bird-static.png" alt="">
        </div>
      </div>

      <div class="mobile-scenery" aria-hidden="true">
        <img class="mobile-tree mobile-tree-left" src="./assets/mobile-forest-left.png" alt="">
        <img class="mobile-tree mobile-tree-right" src="./assets/mobile-forest-right.png" alt="">
        <div class="mobile-post"></div>
        <img class="mobile-fire" src="./assets/mobile-campfire.png" alt="">
      </div>

      <nav id="destinations" aria-label="Infinite Campfire destinations">
        <ol class="destination-list">
          <li class="destination-item">
            <a class="destination-link" href="https://jasonatkinson123-sketch.github.io/synonym-forest/" aria-label="Open Synonym Forest">
              <img class="mobile-sign-art" src="./assets/sign-synonym.png" alt="" aria-hidden="true">
              <span class="destination-label">Synonym Forest</span>
            </a>
          </li>
          <li class="destination-item">
            <a class="destination-link" href="https://jasonatkinson123-sketch.github.io/owl-attack/" aria-label="Open Owl Attack">
              <img class="mobile-sign-art" src="./assets/sign-owl.png" alt="" aria-hidden="true">
              <span class="destination-label">Owl Attack</span>
            </a>
          </li>
          <li class="destination-item">
            <a class="destination-link" href="https://jasonatkinson123-sketch.github.io/french-prepositions/" aria-label="Open Prépositions françaises">
              <img class="mobile-sign-art" src="./assets/sign-french.png" alt="" aria-hidden="true">
              <span class="destination-label">Prépositions<br>françaises</span>
            </a>
          </li>
          <li class="destination-item">
            <a class="destination-link" href="https://derby-character-cash.jjason123.chatgpt.site/" aria-label="Open Derby Character Cash">
              <img class="mobile-sign-art" src="./assets/sign-derby.png" alt="" aria-hidden="true">
              <span class="destination-label">Derby<br>Character Cash</span>
            </a>
          </li>
          <li class="destination-item">
            <a class="destination-link" href="https://jasonatkinson123-sketch.github.io/jazz-ear-trainer/" aria-label="Open Jazz Ear Trainer">
              <img class="mobile-sign-art" src="./assets/sign-jazz.png" alt="" aria-hidden="true">
              <span class="destination-label">Jazz Ear<br>Trainer</span>
            </a>
          </li>
        </ol>
      </nav>
    </section>
  </main>
</body>
</html>
